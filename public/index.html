<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-boxes</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>Check-boxes</h1>
    <div id="container">
         
        <script>
            const socket = io();
            const container = document.getElementById("container")

            window.addEventListener('load', async()=>{
                const response = await fetch('/checkboxes', { method: 'GET' })
                const data = await response.json()
                if(data && data.checkboxes){
                    data.checkboxes.forEach((checked, index)=>{ 

                        const ticks = document.createElement('input')
                        ticks.type='checkbox'
                        ticks.className='checkbox'
                        ticks.id = `${index}`
                        ticks.checked = checked
                        
                        ticks.addEventListener('change', ()=>{
                            console.log(`checkbox with index ${ticks.id} has been affected and it is currently ${ticks.checked}`)
                            socket.emit('client:checkbox-action', {'id':ticks.id, 'isChecked': ticks.checked})
                        })
                        container.append(ticks)     
                    })
                }
            })


            socket.on('server:checkbox-action', (data)=>{
                const box = document.getElementById(data.id)
                console.log("reached here")
                if(data.isChecked){
                    box.checked = true
                }
                else{
                    box.checked = false
                }
            })
        </script>
    </div>
    
</body>
</html>
